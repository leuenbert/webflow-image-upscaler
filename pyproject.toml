[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webflow-upscale"
version = "0.1.0"
description = "Upscale Webflow CMS images with Real-ESRGAN and build an upload index for Claude in Chrome"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0", "requests>=2.31", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]
